[build]
  functions = "netlify/functions"
  publish   = "."
  command   = "node build.js"

# ── Cache headers ──────────────────────────────────────────────────────
# HTML gets a short freshness window so repeat visits within it are
# instant with no revalidation round trip. stale-while-revalidate means
# visitors outside that window still get the cached page immediately,
# while the browser refreshes it in the background for next time — so a
# Netlify redeploy shows up for returning visitors within ~60s, not
# instantly, but without paying a revalidation cost on every load.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=86400"

# Static assets can cache forever — the URLs are content-hashed by the
# folder structure, and updates come with new filenames.
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers ───────────────────────────────────────────────────
# Applied to every path. These are baseline defensive headers that cost
# nothing and get flagged as missing by Lighthouse / Mozilla Observatory.
#
# Content-Security-Policy note: index.html relies on inline <style>,
# inline <script>, and onclick="" attributes throughout (it's a single-file
# SPA), so script-src/style-src must keep 'unsafe-inline' — a strict
# nonce/hash-based policy would require a larger refactor of the whole
# routing/modal system. This policy still meaningfully restricts which
# origins can load scripts, fonts, frames and objects, which is the bulk
# of what a CSP defends against.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(), camera=(), microphone=(), payment=()"
    X-Frame-Options          = "SAMEORIGIN"
    Content-Security-Policy  = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.airtable.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'"
